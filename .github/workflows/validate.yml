name: Validate changed ReDIF records

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed .rdf files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse --verify -q HEAD^ || git hash-object -t tree /dev/null)"
          fi
          git diff --name-only --diff-filter=d "$BASE" HEAD -- 'RePEC/**/*.rdf' > changed.txt
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Validate
        if: steps.changed.outputs.count != '0'
        run: xargs -a changed.txt python3 scripts/validate_redif.py
